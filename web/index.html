<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="客户开发信管理工具 —— 客户信息维护、Excel 批量导入、富文本开发信发送与历史记录" />
    <meta name="theme-color" content="#0f172a" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230ea5e9'/%3E%3Cpath d='M8 11h16M8 16h16M8 21h10' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>客户开发信管理工具 · Customer Dev Letter Manager</title>
    <script>
      // 首屏之前先落地主题类，避免深色模式下的白屏闪烁（FOUC）
      (function () {
        try {
          var raw = localStorage.getItem('cdlm-theme');
          // 应用侧用 JSON 存储（值形如 "dark"），这里兼容带引号与不带引号两种写法
          var stored = raw ? raw.replace(/^"|"$/g, '') : '';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored === 'dark' || stored === 'light' ? stored : prefersDark ? 'dark' : 'light';
          if (theme === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* localStorage 不可用时静默降级为浅色 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
