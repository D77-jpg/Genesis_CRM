# Standalone single-host rehearsal. Publish only the web ingress on host loopback;
# deploy a separate TLS terminator for public traffic (see docs/operations/docker-runtime.md).
services:
  mongo:
    image: mongo:7.0
    command: ["mongod", "--bind_ip_all", "--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env.production}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env.production}
    volumes:
      - mongo_data:/data/db
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand({ping:1}).ok' | grep -q 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
    mem_limit: 1g
    cpus: 1.0

  server:
    build: {context: ./server, dockerfile: Dockerfile}
    image: genesis-crm-server:local
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "5000"
      UPLOAD_DIR: /data/uploads
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI with URI-encoded credentials and mongo hostname}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_DAYS: ${JWT_REFRESH_EXPIRES_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      DEFAULT_ORGANIZATION_NAME: ${DEFAULT_ORGANIZATION_NAME:-Default Organization}
      DEFAULT_ORGANIZATION_SLUG: ${DEFAULT_ORGANIZATION_SLUG:-default}
      MAIL_CREDENTIAL_ENCRYPTION_KEY: ${MAIL_CREDENTIAL_ENCRYPTION_KEY:?Set MAIL_CREDENTIAL_ENCRYPTION_KEY}
      TRACKING_BASE_URL: ${TRACKING_BASE_URL:?Set public HTTPS TRACKING_BASE_URL}
      APP_BASE_URL: ${APP_BASE_URL:-}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set public HTTPS CORS_ORIGIN}
      CORS_ALLOW_PRIVATE_NETWORK: "false"
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-mock}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      IMAP_ENABLED: ${IMAP_ENABLED:-false}
      RUN_BACKGROUND_JOBS: "false"
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    volumes:
      - uploads:/data/uploads
      - backups:/backups
    networks: [internal]
    depends_on:
      mongo: {condition: service_healthy}
    restart: unless-stopped
    stop_grace_period: 20s
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
    mem_limit: 1g
    cpus: 1.0

  worker:
    build: {context: ./server, dockerfile: Dockerfile}
    image: genesis-crm-server:local
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      WORKER_HEALTH_PORT: "5100"
      RUN_BACKGROUND_JOBS: "true"
      UPLOAD_DIR: /data/uploads
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI with URI-encoded credentials and mongo hostname}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: ${DEFAULT_ORGANIZATION_NAME:-Default Organization}
      DEFAULT_ORGANIZATION_SLUG: ${DEFAULT_ORGANIZATION_SLUG:-default}
      MAIL_CREDENTIAL_ENCRYPTION_KEY: ${MAIL_CREDENTIAL_ENCRYPTION_KEY:?Set MAIL_CREDENTIAL_ENCRYPTION_KEY}
      TRACKING_BASE_URL: ${TRACKING_BASE_URL:?Set public HTTPS TRACKING_BASE_URL}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set public HTTPS CORS_ORIGIN}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-mock}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      IMAP_ENABLED: ${IMAP_ENABLED:-false}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    volumes:
      - uploads:/data/uploads
      - backups:/backups
    networks: [internal]
    depends_on:
      mongo: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:5100/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 20s
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
    mem_limit: 1g
    cpus: 1.0

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_APP_TITLE: ${VITE_APP_TITLE:-Genesis CRM}
    image: genesis-crm-web:local
    ports:
      - "127.0.0.1:${GENESIS_HTTP_PORT:-8080}:8080"
    networks: [internal]
    depends_on:
      server: {condition: service_healthy}
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
    mem_limit: 256m
    cpus: 0.5

networks:
  internal:

volumes:
  mongo_data:
  uploads:
  backups:
