name: integration-release-gate

# Genesis_CRM 阶段 2 发布门禁：Integration API v1 契约冻结保护。
# 本分支只允许追加 CI 门禁与兼容性记录，不修改契约实现。

on:
  push:
    branches: [codex/genesis-integration-release, main]
  pull_request:
    branches: [main]

jobs:
  server:
    # GitHub service containers 只能运行在 Linux runner
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
          --health-start-period 10s
    defaults:
      run:
        working-directory: server
        shell: bash
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/cdlm_ci
      NODE_ENV: test
      # CI fixture 值（非真实凭证）：agent/mail 测试进程启动时 env 校验需要
      JWT_SECRET: ci-fixture-jwt-secret-0123456789abcdef
      ADMIN_PASSWORD: ci-fixture-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install（锁定依赖）
        run: npm ci
      - name: Integration API 契约测试（23 项，mongodb-memory-server 自举）
        run: npm run test:integration
      - name: 服务端测试（mail / scratchpad / agent / security / health）
        run: |
          npm run test:mail
          npm run test:scratchpad
          npm run test:agent
          npm run test:prospecting
          npm run test:outreach-automation
          npm run test:security
          npm run test:health
          npx tsc --noEmit --strict --esModuleInterop --skipLibCheck --target ES2022 --module CommonJS --moduleResolution Node tests/prospecting-profiles.test.ts tests/prospecting.test.ts tests/security-hardening.test.ts tests/health-readiness.test.ts
          npm run test:ai-settings
          npm run test:website-research
          npx tsc --noEmit --strict --esModuleInterop --skipLibCheck --target ES2022 --module CommonJS --moduleResolution Node tests/website-research.test.ts tests/website-public-web.test.ts tests/fixtures/website-research/local-retrieval.ts
      - name: Knowledge evaluation fixture and metric contracts (no holdout tuning)
        run: |
          npm run eval:knowledge:validate
          npm run test:knowledge-evaluation
          npm run test:knowledge-facts
          npm run test:knowledge-governance
          npm run test:knowledge-training
          npm run test:knowledge-workflow
          npx tsc --noEmit --strict --esModuleInterop --skipLibCheck --target ES2022 --module CommonJS --moduleResolution Node evaluation/knowledge/schema.ts evaluation/knowledge/metrics.ts evaluation/knowledge/baseline.ts evaluation/knowledge/retrieval.ts evaluation/knowledge/fact-evaluation.ts tests/knowledge-facts.test.ts tests/knowledge-verifier-boundaries.test.ts tests/knowledge-governance.test.ts tests/knowledge-training.test.ts tests/knowledge-governance-ui-fixture.ts tests/knowledge-workflow.test.ts tests/fixtures/knowledge-s5/worker.ts tests/knowledge-workflow-ui-fixture.ts tests/knowledge-acceptance-ui-fixture.ts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local document parsing components and public pinned vocabulary
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk libgl1
          python -m venv .cache/knowledge-parser
          .cache/knowledge-parser/bin/python -m pip install --disable-pip-version-check -r semantic/requirements.lock
          .cache/knowledge-parser/bin/python parsers/setup_runtime.py --assets .cache/knowledge-parser/assets
          .cache/knowledge-parser/bin/python semantic/setup_runtime.py --model-dir .cache/knowledge-semantic/model --reranker-dir .cache/knowledge-semantic/reranker
          echo "KNOWLEDGE_RERANKER_DIR=$PWD/.cache/knowledge-semantic/reranker" >> "$GITHUB_ENV"
          echo "KNOWLEDGE_MODEL_DIR=$PWD/.cache/knowledge-semantic/model" >> "$GITHUB_ENV"
          echo "KNOWLEDGE_PYTHON=$PWD/.cache/knowledge-parser/bin/python" >> "$GITHUB_ENV"
          echo "KNOWLEDGE_TOKENIZER_DIR=$PWD/.cache/knowledge-parser/assets" >> "$GITHUB_ENV"
      - name: Isolated document/OCR/lease recovery and mailbox ACL regression
        run: |
          npm run test:knowledge-retrieval
          npm run test:knowledge-index
          npm run test:knowledge-ingestion
          npm run test:knowledge-operations
          npm run test:knowledge
          npx tsc --noEmit --strict --esModuleInterop --skipLibCheck --target ES2022 --module CommonJS --moduleResolution Node tests/knowledge-ingestion.test.ts tests/knowledge-ui-fixture.ts tests/knowledge-index.test.ts tests/knowledge-retrieval.test.ts tests/knowledge-retrieval-ui-fixture.ts tests/knowledge-index-ui-fixture.ts tests/fixtures/knowledge-s2/worker.ts tests/knowledge-operations.test.ts evaluation/knowledge/operations.ts
      - name: Template feedback regression (H-05)
        run: npm run test:template-feedback
      - name: Security boundary regression tests
        run: npm run test:security
      - name: P3 migration and revenue-path E2E gate
        run: npm run test:p3
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Production build（服务端）
        run: npm run build

  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: H-12 Mongo backup and H-13 container safety tests (skip=0)
        run: |
          node --test scripts/mongo-backup.test.cjs scripts/docker-runtime.test.cjs
      - name: Compose validates using placeholder configuration only
        run: docker compose --env-file production.env.example config --quiet

  web:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install（锁定依赖）
        run: npm ci
      - name: Guarded braces recursion and build consumer regression
        run: npm run test:braces
      - name: Customer cleared-field payload regression
        run: npm run test:customer-fields
      - name: Agent reply Markdown and security regression
        run: npm run test:agent-content
      - name: Production build（含 typecheck）
        run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install locked server and web dependencies
        run: |
          npm ci --prefix server
          npm ci --prefix web --install-links=true
      - name: Guarded braces regression (actual locked web consumers)
        run: npm run test:braces --prefix web
      # Every high/critical production advisory fails CI. xlsx is no longer exempt:
      # SheetJS 0.20.3 is installed from the official CDN tarball, which is outside
      # GHSA-4r6h-8v6p-xvw6 and GHSA-5pgg-2g8v-p4x9.
      - name: Server audit
        run: node scripts/audit-gate.cjs server
      - name: Web audit
        run: node scripts/audit-gate.cjs web
      - name: Install pinned Gitleaks v8.24.0
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Secret scan across git history
        shell: bash
        run: |
          set +e
          /tmp/gitleaks git . --log-opts='--all' --log-level error --no-banner --redact --exit-code 1 \
            --report-format json --report-path /tmp/gitleaks-redacted.json
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            # Scanner output is redacted; disclose ONLY rule + immutable finding
            # fingerprint, never Match, Secret, source lines, or request bodies.
            if [ -f /tmp/gitleaks-redacted.json ]; then
              node -e 'const fs=require("fs"); const findings=JSON.parse(fs.readFileSync("/tmp/gitleaks-redacted.json", "utf8")); console.log(`Gitleaks finding count: ${findings.length}`); for(const item of findings) console.log(`Rule: ${item.RuleID}; fingerprint: ${item.Fingerprint}`)'
            else
              echo 'Gitleaks failed without a report; investigate scanner/setup.'
            fi
          fi
          exit "$status"

  hygiene:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 敏感信息检查（不得出现完整 service token）
        shell: bash
        run: |
          if git grep -nE 'gci_[0-9a-f]{20,}' $(git rev-list HEAD) -- . ; then
            echo "::error::发现疑似 service token 进入提交历史"; exit 1
          fi
          echo "OK: 无 service token"
      - name: 禁止提交 .env / 数据库文件 / 日志
        shell: bash
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)|\.db$|\.sqlite|(^|/)logs?/.*\.log$' | grep -v '\.env\.example' || true)
          if [ -n "$bad" ]; then echo "::error::禁止提交的文件: $bad"; exit 1; fi
          echo "OK"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install locked YAML parser (no dependency changes)
        shell: bash
        run: npm ci --prefix web --ignore-scripts --no-audit --no-fund
      - name: OpenAPI frozen definitions and unimplemented draft checks
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          const { createHash } = require('node:crypto');
          const { readFileSync } = require('node:fs');
          const yaml = require('./web/node_modules/js-yaml');

          const contractPath = 'docs/integration/integration-v1.openapi.yaml';
          const frozenCommit = 'e2e3486300250b75d08295bcba6b8bd09a8e4774';
          const frozenSha = '7798eb621795e8dc405ff56c0fdfb806622ec5a6144d85d6e839ee85d9061679';
          const frozenBytes = execFileSync('git', ['show', frozenCommit + ':' + contractPath]);
          assert.equal(createHash('sha256').update(frozenBytes).digest('hex'), frozenSha,
            'Frozen source must still match the original published SHA');
          const parse = (text) => yaml.load(text, { schema: yaml.JSON_SCHEMA });
          const frozen = parse(frozenBytes.toString('utf8'));
          const candidate = parse(readFileSync(contractPath, 'utf8'));
          const routes = {
            '/globalsite/capabilities': ['get', 'C1', 'globalsite:read'],
            '/globalsite/products': ['get', 'C2', 'products:read'],
            '/globalsite/products/{productId}': ['get', 'C2', 'products:read'],
            '/globalsite/materials': ['get', 'C3', 'materials:read'],
            '/globalsite/materials/{materialId}': ['get', 'C3', 'materials:read'],
            '/globalsite/inquiries': ['post', 'C4', 'inquiries:write'],
          };
          const has = (object, key) => Object.hasOwn(object, key);
          const methods = new Set(['get', 'post', 'put', 'patch', 'delete', 'head', 'options', 'trace']);

          function validate(document) {
            const projected = structuredClone(document);
            let draftCount = 0;
            for (const [path, item] of Object.entries(document.paths)) {
              if (has(frozen.paths, path)) continue;
              const route = routes[path];
              assert(route, 'Unapproved new path: ' + path);
              const [method, phase, scope] = route;
              assert.deepEqual(Object.keys(item), [method], 'Unexpected path-level override: ' + path);
              const operation = item[method];
              assert.equal(operation['x-status'], 'draft', 'New operations must remain drafts');
              assert.equal(operation['x-implementation-phase'], phase, 'Unexpected implementation phase');
              assert.equal(operation['x-required-scope'], scope, 'Unexpected draft scope');
              assert.deepEqual(operation.security, [{ serviceToken: [] }], 'Draft must require bearer auth');
              assert(operation.parameters.some((p) => p.$ref === '#/components/parameters/ProjectId'),
                'Draft must require the existing project binding header');
              assert(operation.summary.startsWith('[草案，尚未实现]'), 'Draft must be clearly labeled');
              delete projected.paths[path];
              draftCount += 1;
            }
            for (const [category, entries] of Object.entries(document.components)) {
              assert(has(frozen.components, category), 'Unapproved component category: ' + category);
              for (const name of Object.keys(entries)) {
                if (has(frozen.components[category], name)) continue;
                assert(['schemas', 'parameters', 'responses'].includes(category)
                  && /^GlobalSite[A-Za-z0-9]+$/.test(name), 'Unapproved new component: ' + name);
                delete projected.components[category][name];
              }
            }
            if (has(document, 'x-globalsite-draft')) {
              const metadata = document['x-globalsite-draft'];
              assert.equal(metadata.status, 'draft');
              assert.equal(metadata.implemented, false, 'Draft cannot claim to be implemented');
              assert.deepEqual(metadata.phases, ['C1', 'C2', 'C3', 'C4']);
              delete projected['x-globalsite-draft'];
            } else {
              assert.equal(draftCount, 0, 'Draft operations require explicit unimplemented metadata');
              assert.deepEqual(document, frozen, 'Additions require explicit draft metadata');
            }
            // Only the allowlisted additions were removed. Any change to the old contract,
            // its shared components, or any other top-level field fails this comparison.
            assert.deepEqual(projected, frozen, 'Previously frozen contract definitions changed');

            const operationIds = new Set();
            for (const item of Object.values(document.paths)) {
              for (const [method, operation] of Object.entries(item)) {
                if (!methods.has(method)) continue;
                assert(typeof operation.operationId === 'string' && operation.operationId.length > 0);
                assert(!operationIds.has(operation.operationId), 'Duplicate operationId');
                operationIds.add(operation.operationId);
              }
            }
            let refCount = 0;
            function walk(value) {
              if (!value || typeof value !== 'object') return;
              if (has(value, '$ref')) {
                assert(typeof value.$ref === 'string' && value.$ref.startsWith('#/'),
                  'Only local contract references are allowed');
                let target = document;
                for (const part of value.$ref.slice(2).split('/')) {
                  const key = part.replace(/~1/g, '/').replace(/~0/g, '~');
                  assert(target && typeof target === 'object' && has(target, key),
                    'Unresolved reference: ' + value.$ref);
                  target = target[key];
                }
                refCount += 1;
              }
              for (const child of Object.values(value)) walk(child);
            }
            walk(document);
            return { draftCount, refCount };
          }

          // Guard regressions run with the exact validator used on the real document.
          validate(frozen);
          const result = validate(candidate);
          assert.equal(result.draftCount, 6, 'S1 must include all six reviewed draft operations');
          const cases = [
            ['old endpoint changed', (d) => { d.paths['/health'].get.summary += ' changed'; }],
            ['old endpoint removed', (d) => { delete d.paths['/outcomes']; }],
            ['old shared schema changed', (d) => { d.components.schemas.Error.required = []; }],
            ['version changed', (d) => { d.info.version = '2.0.0'; }],
            ['draft published', (d) => { d.paths['/globalsite/inquiries'].post['x-status'] = 'stable'; }],
            ['draft claims implemented', (d) => { d['x-globalsite-draft'].implemented = true; }],
            ['project header removed', (d) => { d.paths['/globalsite/capabilities'].get.parameters = []; }],
            ['bearer auth removed', (d) => { d.paths['/globalsite/capabilities'].get.security = []; }],
            ['scope changed', (d) => { d.paths['/globalsite/products'].get['x-required-scope'] = 'stats:read'; }],
            ['phase changed', (d) => { d.paths['/globalsite/products'].get['x-implementation-phase'] = 'C4'; }],
            ['unapproved path', (d) => { d.paths['/other'] = d.paths['/globalsite/products']; }],
            ['path server override', (d) => { d.paths['/globalsite/products'].servers = []; }],
            ['duplicate operation ID', (d) => {
              d.paths['/globalsite/capabilities'].get.operationId = d.paths['/health'].get.operationId;
            }],
            ['broken reference', (d) => {
              d.components.schemas.GlobalSiteAsset.properties.id = { $ref: '#/components/schemas/Missing' };
            }],
            ['unapproved component', (d) => { d.components.schemas.Other = { type: 'string' }; }],
            ['unapproved top-level field', (d) => { d.security = []; }],
          ];
          for (const [name, mutate] of cases) {
            const changed = structuredClone(candidate);
            mutate(changed);
            assert.throws(() => validate(changed), undefined, 'Gate accepted invalid mutation: ' + name);
          }
          assert.throws(() => parse('openapi: 3.0.3\nopenapi: 3.0.3\n'), 'Duplicate YAML keys must fail');
          console.log('PASS: original frozen SHA verified; original definitions unchanged; '
            + result.draftCount + ' unimplemented drafts; ' + result.refCount + ' references; '
            + (cases.length + 1) + ' rejection regressions.');

          NODE
      - name: 兼容性记录校验（版本 + 完整契约哈希 + 双方实现基线）
        shell: bash
        run: |
          f=docs/integration/COMPATIBILITY.md
          test -f "$f" || { echo "::error::缺少兼容性记录"; exit 1; }
          grep -qF "契约版本：**1.0**" "$f" || { echo "::error::缺少契约版本 1.0"; exit 1; }
          grep -qF "7798eb621795e8dc405ff56c0fdfb806622ec5a6144d85d6e839ee85d9061679" "$f" || { echo "::error::契约哈希缺失或不匹配"; exit 1; }
          grep -qF "e2e3486" "$f" || { echo "::error::缺少 Genesis 实现基线 commit"; exit 1; }
          grep -qF "491b1d3" "$f" || { echo "::error::缺少 AutoForceAI 实现基线 commit"; exit 1; }
          grep -qF "genesis-integration-v1.0.0" "$f" || { echo "::error::缺少 Genesis 标签名"; exit 1; }
          grep -qF "autoforce-phase2-core-v1.0.0" "$f" || { echo "::error::缺少 AutoForceAI 标签名"; exit 1; }
          echo "OK: 兼容性记录校验通过"
