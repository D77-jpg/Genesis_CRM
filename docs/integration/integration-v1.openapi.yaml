      description: >-
        先归档并事务保存客户、附件任务和站内负责人通知，再返回201；重放保留首次结果。来源globalsite。只补空字段，不覆盖负责人/阶段或既有外部引用。按邮箱匹配，企业域名唯一匹配时可合并；公共邮箱/歧义不按域名合并。嵌套载荷严格校验；签名附件URL不参与业务内容散列；首次地址供后台下载，重放不刷新地址，过期会显示附件失败；其他业务内容改变返回409。附件失败不撤销询盘。返回相对CRM前端地址。
