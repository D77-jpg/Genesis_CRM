    get:
      x-status: draft
      x-implementation-phase: C1
      x-required-scope: globalsite:read
      tags:
        - globalsite-draft
      operationId: getGlobalSiteCapabilities
      summary: '[草案，尚未实现] 查询已实现且凭证获授权的 GlobalSite 能力'
      description: S1 设计草案。实现前不得作为在线能力；批准实现后再更新冻结快照。组织由凭证及绑定项目解析，不接受请求体组织 ID。
      security:
        - serviceToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: 成功；结构以草案为准。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalSiteCapabilitiesResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '404':
          $ref: '#/components/responses/ProjectMismatch'
        '429':
          $ref: '#/components/responses/GlobalSiteRateLimited'
        '500':
          $ref: '#/components/responses/GlobalSiteInternalError'
        '503':
          $ref: '#/components/responses/GlobalSiteUnavailable'
  /globalsite/products:
    get:
      x-status: draft
      x-implementation-phase: C2
      x-required-scope: products:read
      tags:
        - globalsite-draft
      operationId: listGlobalSiteProducts
      summary: '[草案，尚未实现] 增量读取产品'
      description: >-
        S1 设计草案。实现前不得作为在线能力；批准实现后再更新冻结快照。组织由凭证及绑定项目解析，不接受请求体组织 ID。 只返回显式公开投影与撤销 tombstone；不返回内部 notes/价格/私密内容。nextCursor
        在末页和空页仍为增量水位；hasMore=false 后等待下一轮。游标规则见 globalsite-对接设计.md，不能套用到旧 outcomes。
      security:
        - serviceToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/GlobalSiteCursor'
        - $ref: '#/components/parameters/GlobalSiteLimit'
      responses:
        '200':
          description: 成功；结构以草案为准。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalSiteProductFeedResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '404':
          $ref: '#/components/responses/ProjectMismatch'
        '429':
          $ref: '#/components/responses/GlobalSiteRateLimited'
        '500':
          $ref: '#/components/responses/GlobalSiteInternalError'
        '503':
          $ref: '#/components/responses/GlobalSiteUnavailable'
  /globalsite/products/{productId}:
    get:
      x-status: draft
      x-implementation-phase: C2
      x-required-scope: products:read
      tags:
        - globalsite-draft
      operationId: getGlobalSiteProduct
      summary: '[草案，尚未实现] 查询产品详情或撤销标记'
      description: S1 设计草案。实现前不得作为在线能力；批准实现后再更新冻结快照。组织由凭证及绑定项目解析，不接受请求体组织 ID。
      security:
        - serviceToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: productId
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
      responses:
        '200':
          description: 成功；结构以草案为准。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalSiteProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '404':
          description: 项目未绑定、资源未授权或不属于本项目，统一404。
          content:
            application/json:
              schema:
