components:
  securitySchemes:
    GlobalSiteC2Session:
      type: apiKey
      in: cookie
      name: cdlm_access
      description: CRM用户Cookie会话；不是服务凭证。
    GlobalSiteC2UserBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 兼容现有用户JWT；不是gci_服务凭证。

    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Genesis 管理员签发的服务凭证（形如 `gci_...`）。数据库只存哈希，
        原始 token 仅创建时显示一次。凭证绑定项目集合与 scope，支持轮换与撤销。

  parameters:
    GlobalSiteC2Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 1
    GlobalSiteC2Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    GlobalSiteC2CredentialId:
      name: credentialId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-fA-F0-9]{24}$
    GlobalSiteC2Csrf:
      name: X-CSRF-Token
      in: header
      required: false
      description: Cookie会话写请求必填且与会话Cookie匹配；旧Bearer用户JWT方式保持兼容。
      schema:
        type: string
    GlobalSiteC2LogCredential:
      name: credentialId
      in: query
      required: false
      schema:
        type: string
        pattern: ^[a-fA-F0-9]{24}$

    ProjectId:
      name: X-Project-Id
      in: header
      required: true
      schema:
        type: string
        pattern: '^[a-f\d]{24}$'
      description: 目标项目 ID。必须显式携带且在凭证绑定的项目集合内；无默认项目回退。

    GlobalSiteCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 2048
      description: 草案：签名 opaque 游标，7 天有效，绑定组织/项目/资源/权限；过期返回 VALIDATION_ERROR details.reason=CURSOR_EXPIRED。
    GlobalSiteLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    GlobalSiteIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: 草案：重试保持原 key 与原始载荷，跨操作/项目隔离；同业务键异载荷也返回409。

    GlobalSiteC1UpdatedSince:
      name: updatedSince
      in: query
      required: false
      description: UTC ISO8601 时间，包含边界（>=）。仅首轮传入；配合游标时不能更改。缺省全量；允许与当前游标相同值。
      schema:
        type: string
        format: date-time
    GlobalSiteC1Cursor:
      name: cursor
      in: query
      required: false
      description: 上一页 nextCursor，原样传入；过期/篡改/跨范围返回 422 VALIDATION_ERROR。
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    GlobalSiteC1Limit:
      name: limit
      in: query
      required: false
      description: 每页数量。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    GlobalSiteC1ProductId:
      name: id
      in: path
      required: true
      description: 本项目内的稳定产品 ID。
      schema:
        type: string
        nullable: false
        description: 稳定 Mongo ObjectId 字符串；不为空，不使用 SKU 或名称。
        pattern: ^[a-f0-9]{24}$
    GlobalSiteC1ImageId:
      name: imageId
      in: path
      required: true
      description: 图片公开记录中的稳定 ID。
      schema:
        type: string
        nullable: false
        description: 稳定 Mongo ObjectId 字符串；不为空，不使用 SKU 或名称。
        pattern: ^[a-f0-9]{24}$
    GlobalSiteC1Expires:
      name: expires
      in: query
      required: true
      description: 签名过期 Unix 秒数。
      schema:
        type: integer
        minimum: 1
    GlobalSiteC1Signature:
      name: signature
      in: query
      required: true
      description: 签名，不是服务凭证；不得记录。
      schema:
        type: string
        pattern: ^[a-f0-9]{64}$

  schemas:
    GlobalSiteC3Product:
      type: object
      additionalProperties: false
      properties:
        globalSiteProductId:
          type: string
          maxLength: 128
          minLength: 1
        crmProductId:
          type: string
          pattern: ^[a-f0-9]{24}$
          nullable: true
        name:
          type: string
          maxLength: 200
          minLength: 1
      required:
        - globalSiteProductId
        - crmProductId
        - name
    GlobalSiteC3Attachment:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          maxLength: 128
          minLength: 1
        fileName:
          type: string
          maxLength: 160
          minLength: 1
        downloadUrl:
          type: string
          maxLength: 2000
          format: uri
        expiresAt:
          type: string
          format: date-time
        mime:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - application/pdf
        bytes:
          type: integer
          minimum: 1
          maximum: 2097152
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
      required:
        - id
        - fileName
        - downloadUrl
        - expiresAt
        - mime
        - bytes
        - sha256
    GlobalSiteC3Source:
      type: object
      additionalProperties: false
      properties:
        pageUrl:
          type: string
          maxLength: 2000
          format: uri
        referrer:
          type: string
          maxLength: 2000
          format: uri
          nullable: true
        utm:
          type: object
          additionalProperties: false
          properties:
            source:
              type: string
              maxLength: 200
              nullable: true
            medium:
              type: string
              maxLength: 200
              nullable: true
            campaign:
              type: string
              maxLength: 200
              nullable: true
            term:
              type: string
              maxLength: 200
              nullable: true
            content:
              type: string
              maxLength: 200
              nullable: true
          required:
            - source
            - medium
            - campaign
            - term
            - content
        device:
          type: string
          enum:
            - desktop
            - mobile
            - tablet
            - unknown
        firstVisitAt:
          type: string
          format: date-time
          nullable: true
      required:
        - pageUrl
        - referrer
        - utm
        - device
        - firstVisitAt
    GlobalSiteC3Input:
      type: object
      additionalProperties: false
      properties:
        schemaVersion:
          type: string
          enum:
            - '1.0'
        sourceSystem:
          type: string
          enum:
            - globalsite
        externalInquiryId:
          type: string
          maxLength: 128
          minLength: 1
        site:
          type: object
          additionalProperties: false
          properties:
            id:
              type: string
              maxLength: 128
              minLength: 1
            name:
              type: string
              maxLength: 200
              minLength: 1
          required:
            - id
            - name
        submittedAt:
          type: string
          format: date-time
        contact:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
              maxLength: 100
              minLength: 1
            email:
              type: string
              maxLength: 200
              format: email
            phone:
              type: string
              maxLength: 80
            company:
              type: string
              maxLength: 160
            country:
              type: string
              maxLength: 80
          required:
            - name
            - email
            - phone
            - company
            - country
        products:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/GlobalSiteC3Product'
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000000
          nullable: true
        message:
          type: string
          maxLength: 8000
          minLength: 1
        attachments:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/GlobalSiteC3Attachment'
        source:
          $ref: '#/components/schemas/GlobalSiteC3Source'
        spamScore:
          type: integer
          minimum: 0
          maximum: 100
      required:
        - schemaVersion
        - sourceSystem
        - externalInquiryId
        - site
        - submittedAt
        - contact
        - products
        - quantity
        - message
        - attachments
        - source
        - spamScore
    GlobalSiteC3Result:
      type: object
      additionalProperties: false
      properties:
        inquiryId:
          type: string
          pattern: ^[a-f0-9]{24}$
        customerId:
          type: string
          pattern: ^[a-f0-9]{24}$
        prospectId:
          type: string
          nullable: true
          enum:
            - null
        customerUrl:
          type: string
          pattern: ^/customers/[a-f0-9]{24}$
        projectId:
          type: string
          pattern: ^[a-f0-9]{24}$
        action:
          type: string
          enum:
            - created
            - linked
        attachmentStatus:
          type: string
          enum:
            - pending
            - none
        sourceSystem:
          type: string
          enum:
            - globalsite
      required:
        - inquiryId
        - customerId
        - prospectId
        - customerUrl
        - projectId
        - action
        - attachmentStatus
        - sourceSystem
    GlobalSiteC3Draft:
      type: object
      additionalProperties: false
      properties:
        letterId:
          type: string
          pattern: ^[a-f0-9]{24}$
        customerId:
          type: string
          pattern: ^[a-f0-9]{24}$
        status:
          type: string
          enum:
            - draft
        url:
          type: string
      required:
        - letterId
        - customerId
        - status
        - url
    GlobalSiteC3PrivateInquiry:
      type: object
      description: Tenant/project/customer-authorized view; signed download addresses are never returned.
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{24}$
        customerId:
          type: string
          pattern: ^[a-f0-9]{24}$
        externalInquiryId:
          type: string
          maxLength: 128
        site:
          type: object
        submittedAt:
          type: string
          format: date-time
        contact:
          type: object
        products:
          type: array
          items:
            $ref: '#/components/schemas/GlobalSiteC3Product'
        quantity:
          type: integer
          nullable: true
        message:
          type: string
          maxLength: 8000
        source:
          $ref: '#/components/schemas/GlobalSiteC3Source'
        spamScore:
          type: integer
        attachments:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: string
                maxLength: 128
              fileName:
                type: string
                maxLength: 160
              mime:
                type: string
                maxLength: 80
              bytes:
                type: integer
              status:
                type: string
                enum:
                  - pending
                  - stored
                  - failed
              url:
                type: string
                maxLength: 300
                nullable: true
              errorCode:
                type: string
                maxLength: 80
                nullable: true
            required:
              - id
              - fileName
              - mime
              - bytes
              - status
              - url
              - errorCode
        read:
          type: boolean
      required:
        - id
        - customerId
        - externalInquiryId
        - site
        - submittedAt
        - contact
        - products
        - quantity
        - message
        - source
        - spamScore
        - attachments
        - read
    GlobalSiteC3Response:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: '#/components/schemas/GlobalSiteC3Result'
      required:
        - success
        - data
    GlobalSiteC3List:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          additionalProperties: false
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/GlobalSiteC3PrivateInquiry'
            hasMore:
              type: boolean
            nextCursor:
              type: string
              pattern: ^[a-f0-9]{24}$
              nullable: true
          required:
            - items
            - hasMore
            - nextCursor
      required:
        - success
        - data
    GlobalSiteC3DraftResponse:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: '#/components/schemas/GlobalSiteC3Draft'
      required:
        - success
        - data
    GlobalSiteC3Notices:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          additionalProperties: false
          properties:
            items:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  id:
                    type: string
                    pattern: ^[a-f0-9]{24}$
                  customerId:
                    type: string
                    pattern: ^[a-f0-9]{24}$
                  url:
                    type: string
                    maxLength: 300
                  siteName:
                    type: string
                    maxLength: 200
                  submittedAt:
                    type: string
                    format: date-time
                required:
                  - id
                  - customerId
                  - url
                  - siteName
                  - submittedAt
            count:
              type: integer
          required:
            - items
            - count
      required:
        - success
        - data
    GlobalSiteC2Credential:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - scopes
        - createdBy
        - createdAt
        - lastUsedAt
        - expiresAt
        - previousValidUntil
        - status
        - projectCount
      properties:
        id:
          type: string
          description: 凭证稳定 ID；非明文或哈希。
        name:
          type: string
          minLength: 1
          maxLength: 120
        scopes:
          type: array
          items:
            type: string
            enum:
              - products:read
              - company:read
              - playbook:read
              - knowledge:read
              - customers:upsert
              - inquiries:write
              - outcomes:read
              - stats:read
              - quotations:draft
              - quotations:read
        createdBy:
          type: object
          additionalProperties: false
          required:
            - id
            - displayName
          properties:
            id:
              type: string
              description: 用户 ID
            displayName:
              type: string
              description: 当前显示名称
          nullable: true
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        previousValidUntil:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum:
            - active
            - expired
            - revoked
        projectCount:
          type: integer
          minimum: 1
          description: 此凭证绑定的项目数量；只有全部绑定项目均在管理员权限内才可管理。
    GlobalSiteC2Create:
      type: object
      additionalProperties: false
      required:
        - name
        - scopes
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        scopes:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            enum:
              - products:read
              - company:read
              - playbook:read
              - knowledge:read
              - customers:upsert
              - inquiries:write
              - outcomes:read
              - stats:read
              - quotations:draft
              - quotations:read
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: 可选到期时间，必须晚于服务端现在；null表示无固定到期。
    GlobalSiteC2Rotate:
      type: object
      additionalProperties: false
      properties:
        graceSeconds:
          type: integer
          minimum: 0
          maximum: 604800
          default: 86400
          description: 旧令牌宽限秒数；0立即失效；默认24小时，最长7天。脚本默认仍为0。
    GlobalSiteC2Issued:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          additionalProperties: false
          required:
            - credential
            - token
          properties:
            credential:
              $ref: '#/components/schemas/GlobalSiteC2Credential'
            token:
              type: string
              pattern: ^gci_[a-f0-9]{48}$
              description: 仅本次创建/轮换响应提供，必须no-store，不得持久化、记录或重放取回。
    GlobalSiteC2Revoked:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: '#/components/schemas/GlobalSiteC2Credential'
    GlobalSiteC2Log:
      type: object
      additionalProperties: false
      required:
        - id
        - createdAt
        - method
        - route
        - statusCode
        - latencyMs
      properties:
        id:
          type: string
          description: 日志 ID
        createdAt:
          type: string
          format: date-time
        method:
          type: string
          description: HTTP 方法
        route:
          type: string
          description: 路由模板；无查询串
        statusCode:
          type: integer
          minimum: 100
          maximum: 599
        latencyMs:
          type: number
          minimum: 0
    GlobalSiteC2Credentials:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          additionalProperties: false
          required:
            - items
            - page
            - limit
            - total
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/GlobalSiteC2Credential'
            page:
              type: integer
              minimum: 1
            limit:
              type: integer
              minimum: 1
              maximum: 50
            total:
              type: integer
              minimum: 0
    GlobalSiteC2Logs:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          additionalProperties: false
          required:
            - items
            - page
            - limit
            - total
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/GlobalSiteC2Log'
            page:
              type: integer
              minimum: 1
            limit:
              type: integer
              minimum: 1
              maximum: 50
            total:
              type: integer
              minimum: 0
    GlobalSiteC2Settings:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          additionalProperties: false
          required:
            - scopes
            - globalsitePreset
            - quota
          properties:
            scopes:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  - name
                  - available
                properties:
                  name:
                    type: string
                    enum:
                      - products:read
                      - company:read
                      - playbook:read
                      - knowledge:read
                      - customers:upsert
                      - inquiries:write
                      - outcomes:read
                      - stats:read
                      - quotations:draft
                      - quotations:read
                  available:
                    type: boolean
            globalsitePreset:
              type: array
              items:
                type: string
                enum:
                  - products:read
                  - company:read
                  - playbook:read
                  - knowledge:read
                  - customers:upsert
                  - inquiries:write
                  - outcomes:read
                  - stats:read
                  - quotations:draft
                  - quotations:read
            quota:
              type: object
              additionalProperties: false
              required:
                - limit
                - used
              properties:
                limit:
                  type: integer
                  minimum: 1
                used:
                  type: integer
                  minimum: 0

    Error:
      type: object
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          properties:
            code:
              type: string
              description: |
                稳定错误码：`UNAUTHORIZED`（token 缺失/无效/撤销/过期）、
                `FORBIDDEN_SCOPE`（缺 scope）、`PROJECT_MISMATCH`（项目未绑定/不存在）、
                `VALIDATION_ERROR`（请求字段不合法，4xx，消费方不应无限重试）、
                `UNSUPPORTED_CONTRACT_VERSION`（schemaVersion 不受支持）、
                `NOT_FOUND`、`CONFLICT`（幂等键冲突且载荷不同）、
                `RATE_LIMITED`、`INTERNAL_ERROR`。
              example: "FORBIDDEN_SCOPE"
            message:
              type: string
              example: "凭证缺少所需 scope: outcomes:read"
            details:
              type: array
              items:
                type: object
            requestId:
              type: string
              description: 服务端请求 ID，用于工单排查（与审计日志对应）。
          required: [code, message]
      required: [success, error]

    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [ok, contractVersion, serverTime, projectId, scopes]
          properties:
            ok: { type: boolean }
            contractVersion: { type: string, example: "1.0" }
            serverTime: { type: string, format: date-time }
            projectId: { type: string }
            projectName: { type: string, nullable: true }
            scopes:
              type: array
              items: { type: string }
            credentialId: { type: string, nullable: true }
      required: [success, data]

    CustomerUpsertRequest:
      type: object
      required: [schemaVersion, sourceSystem, externalId]
      properties:
        schemaVersion:
          type: string
          const: "1.0"
        sourceSystem:
          type: string
          description: 来源系统标识；AutoForceAI 固定为 `autoforce`。
          example: "autoforce"
        externalId:
          type: string
          maxLength: 128
          description: 稳定外部主键（如 `lead:<id>`）。禁止复用邮箱。
        initialStatus:
          type: string
          enum: [pending, contacted, interested]
          description: |
            仅创建时生效。映射：AutoForceAI new→pending、contacted→contacted、
            converted→interested；dropped 不自动推送。
        name: { type: string, maxLength: 120 }
        company: { type: string, maxLength: 200 }
        email:
          type: string
          format: email
          maxLength: 200
          description: 规范化小写；仅作为可能重复的辅助匹配条件，不是幂等键。
        phone: { type: string, maxLength: 60 }
        country: { type: string, maxLength: 120 }
        interestedProducts: { type: string, maxLength: 500 }
        leadSource:
          type: string
          maxLength: 120
          description: 建议格式 `AutoForceAI / <channel>`。
        productModel: { type: string, maxLength: 200 }
        productCategory: { type: string, maxLength: 200 }
        expectedQuantity:
          type: string
          maxLength: 120
          description: 保留单位，如 `5000 pcs`。
        targetPrice:
          type: string
          maxLength: 120
          description: 保留币种，如 `USD 1.20/pc`。
        moq: { type: string, maxLength: 120 }
        requirementNotes:
          type: string
          maxLength: 5000
          description: AI 需求摘要；不复制完整会话。
        tags:
          type: array
          maxItems: 30
          items: { type: string }
          description: 建议包含 `autoforce`、`channel:<slug>`。

    CustomerUpsertResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [action, customerId, projectId, externalId, remoteUpdatedAt]
          properties:
            action:
              type: string
              enum: [created, linked, unchanged]
            customerId: { type: string }
            projectId: { type: string }
            externalId: { type: string }
            remoteUpdatedAt: { type: string, format: date-time }
      required: [success, data]

    OutcomeEvent:
      type: object
      required: [eventId, cursor, customerId, toStatus, occurredAt]
      properties:
        eventId:
          type: string
          description: 消费方按此幂等去重。
        cursor:
          type: string
          description: opaque；消费方无需解析，下一次请求原样带回。
        customerId: { type: string }
        externalId:
          type: string
          nullable: true
          description: 无外部引用（CRM 原生客户）时为 null。
        fromStatus:
          type: string
          nullable: true
          enum: [pending, contacted, replied, interested, quoting, negotiating, won, lost, null]
        toStatus:
          type: string
          enum: [won, lost]
        occurredAt: { type: string, format: date-time }

    OutcomeFeedResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [items, hasMore]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/OutcomeEvent'
            nextCursor:
              type: string
              nullable: true
            hasMore: { type: boolean }
      required: [success, data]

    FunnelStage:
      type: object
