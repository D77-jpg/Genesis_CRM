  /globalsite/inquiries:
    post:
      x-status: draft
      x-implementation-phase: C4
      x-required-scope: inquiries:write
      tags:
        - globalsite-draft
      operationId: storeGlobalSiteInquiry
      summary: '[草案，尚未实现] 按询盘外部 ID 幂等存档完整需求'
      description: >-
        S1 设计草案。实现前不得作为在线能力；批准实现后再更新冻结快照。组织由凭证及绑定项目解析，不接受请求体组织 ID。 前置：现有 customers/upsert 已成功取得本项目
        customerId。只归档、不修改销售维护字段；同业务 ID 与同载荷返回原 data，不同载荷409。请求体上限32KiB；不接附件或原始IP/Cookie。
      security:
        - serviceToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/GlobalSiteIdempotencyKey'
      responses:
        '200':
          description: 同业务记录重放，data 与首次一致；请求重放可保留首次201状态。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalSiteInquiryResponse'
        '201':
          description: 首次持久化成功，stored不表示销售已读。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalSiteInquiryResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '404':
          $ref: '#/components/responses/ProjectMismatch'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/GlobalSiteRateLimited'
        '500':
          $ref: '#/components/responses/GlobalSiteInternalError'
        '503':
          $ref: '#/components/responses/GlobalSiteUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalSiteInquiryRequest'

components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Genesis 管理员签发的服务凭证（形如 `gci_...`）。数据库只存哈希，
        原始 token 仅创建时显示一次。凭证绑定项目集合与 scope，支持轮换与撤销。

  parameters:
    ProjectId:
      name: X-Project-Id
      in: header
      required: true
      schema:
        type: string
        pattern: '^[a-f\d]{24}$'
      description: 目标项目 ID。必须显式携带且在凭证绑定的项目集合内；无默认项目回退。

    GlobalSiteCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 2048
      description: 草案：签名 opaque 游标，7 天有效，绑定组织/项目/资源/权限；过期返回 VALIDATION_ERROR details.reason=CURSOR_EXPIRED。
    GlobalSiteLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    GlobalSiteIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: 草案：重试保持原 key 与原始载荷，跨操作/项目隔离；同业务键异载荷也返回409。

  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          properties:
            code:
              type: string
              description: |
                稳定错误码：`UNAUTHORIZED`（token 缺失/无效/撤销/过期）、
                `FORBIDDEN_SCOPE`（缺 scope）、`PROJECT_MISMATCH`（项目未绑定/不存在）、
                `VALIDATION_ERROR`（请求字段不合法，4xx，消费方不应无限重试）、
                `UNSUPPORTED_CONTRACT_VERSION`（schemaVersion 不受支持）、
                `NOT_FOUND`、`CONFLICT`（幂等键冲突且载荷不同）、
                `RATE_LIMITED`、`INTERNAL_ERROR`。
              example: "FORBIDDEN_SCOPE"
            message:
              type: string
              example: "凭证缺少所需 scope: outcomes:read"
            details:
              type: array
              items:
                type: object
            requestId:
              type: string
              description: 服务端请求 ID，用于工单排查（与审计日志对应）。
          required: [code, message]
      required: [success, error]

    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [ok, contractVersion, serverTime, projectId, scopes]
          properties:
            ok: { type: boolean }
            contractVersion: { type: string, example: "1.0" }
            serverTime: { type: string, format: date-time }
            projectId: { type: string }
            projectName: { type: string, nullable: true }
            scopes:
              type: array
              items: { type: string }
            credentialId: { type: string, nullable: true }
      required: [success, data]

    CustomerUpsertRequest:
      type: object
      required: [schemaVersion, sourceSystem, externalId]
      properties:
        schemaVersion:
          type: string
          const: "1.0"
        sourceSystem:
          type: string
          description: 来源系统标识；AutoForceAI 固定为 `autoforce`。
          example: "autoforce"
        externalId:
          type: string
          maxLength: 128
          description: 稳定外部主键（如 `lead:<id>`）。禁止复用邮箱。
        initialStatus:
          type: string
          enum: [pending, contacted, interested]
          description: |
            仅创建时生效。映射：AutoForceAI new→pending、contacted→contacted、
            converted→interested；dropped 不自动推送。
        name: { type: string, maxLength: 120 }
        company: { type: string, maxLength: 200 }
        email:
          type: string
          format: email
          maxLength: 200
          description: 规范化小写；仅作为可能重复的辅助匹配条件，不是幂等键。
        phone: { type: string, maxLength: 60 }
        country: { type: string, maxLength: 120 }
        interestedProducts: { type: string, maxLength: 500 }
        leadSource:
          type: string
          maxLength: 120
          description: 建议格式 `AutoForceAI / <channel>`。
        productModel: { type: string, maxLength: 200 }
        productCategory: { type: string, maxLength: 200 }
        expectedQuantity:
          type: string
          maxLength: 120
          description: 保留单位，如 `5000 pcs`。
        targetPrice:
          type: string
          maxLength: 120
          description: 保留币种，如 `USD 1.20/pc`。
        moq: { type: string, maxLength: 120 }
        requirementNotes:
          type: string
          maxLength: 5000
          description: AI 需求摘要；不复制完整会话。
        tags:
          type: array
          maxItems: 30
          items: { type: string }
          description: 建议包含 `autoforce`、`channel:<slug>`。

    CustomerUpsertResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [action, customerId, projectId, externalId, remoteUpdatedAt]
          properties:
            action:
              type: string
              enum: [created, linked, unchanged]
            customerId: { type: string }
            projectId: { type: string }
            externalId: { type: string }
            remoteUpdatedAt: { type: string, format: date-time }
      required: [success, data]

    OutcomeEvent:
      type: object
      required: [eventId, cursor, customerId, toStatus, occurredAt]
      properties:
        eventId:
          type: string
          description: 消费方按此幂等去重。
        cursor:
          type: string
          description: opaque；消费方无需解析，下一次请求原样带回。
        customerId: { type: string }
        externalId:
          type: string
          nullable: true
          description: 无外部引用（CRM 原生客户）时为 null。
        fromStatus:
          type: string
          nullable: true
          enum: [pending, contacted, replied, interested, quoting, negotiating, won, lost, null]
        toStatus:
          type: string
          enum: [won, lost]
        occurredAt: { type: string, format: date-time }

    OutcomeFeedResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [items, hasMore]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/OutcomeEvent'
            nextCursor:
              type: string
              nullable: true
            hasMore: { type: boolean }
      required: [success, data]

    FunnelStage:
      type: object
      required: [status, count]
      properties:
        status:
          type: string
          enum: [pending, contacted, replied, interested, quoting, negotiating, won, lost]
        count: { type: integer, minimum: 0 }

    QuotationStatusCount:
      type: object
      required: [status, count]
      properties:
        status:
          type: string
          enum: [draft, sent, negotiating, accepted, rejected, expired]
        count: { type: integer, minimum: 0 }

    StatsOverviewResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [projectId, totalCustomers, funnel, wonCount, lostCount, quotations, generatedAt]
          properties:
            projectId: { type: string }
            totalCustomers: { type: integer, minimum: 0 }
            funnel:
              type: array
              items:
                $ref: '#/components/schemas/FunnelStage'
            wonCount: { type: integer, minimum: 0 }
            lostCount: { type: integer, minimum: 0 }
            quotations:
              type: array
              items:
                $ref: '#/components/schemas/QuotationStatusCount'
            generatedAt: { type: string, format: date-time }
      required: [success, data]

    CustomerStatusResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [customerId, status, updatedAt]
          properties:
            customerId: { type: string }
            externalId: { type: string, nullable: true }
            name: { type: string, nullable: true }
            company: { type: string, nullable: true }
            status:
              type: string
              enum: [pending, contacted, replied, interested, quoting, negotiating, won, lost]
            ownerName: { type: string, nullable: true }
            lastFollowUpAt: { type: string, format: date-time, nullable: true }
            updatedAt: { type: string, format: date-time }
      required: [success, data]

    QuotationSummary:
      type: object
      required: [quotationId, status, updatedAt]
      properties:
        quotationId: { type: string }
        quotationNo: { type: string, nullable: true }
        status:
          type: string
          enum: [draft, sent, negotiating, accepted, rejected, expired]
        totalAmount: { type: number, nullable: true }
        currency: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time }

    CustomerQuotationsResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [customerId, items]
          properties:
            customerId: { type: string }
            items:
              type: array
              items:
                $ref: '#/components/schemas/QuotationSummary'
      required: [success, data]

    GlobalSiteAsset:
      type: object
      required:
        - id
        - url
        - expiresAt
        - sha256
        - mime
        - bytes
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        url:
          type: string
          format: uri
          description: 短期签名 HTTPS 下载地址，仅公开授权资源；不得返回本地路径。
        expiresAt:
          type: string
          format: date-time
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        mime:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - application/pdf
        bytes:
          type: integer
          minimum: 1
          maximum: 10485760
    GlobalSiteProduct:
      type: object
      required:
        - id
        - revision
        - updatedAt
        - deleted
        - sku
        - name
        - status
        - specs
        - assets
      properties:
        id:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
        revision:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
        deleted:
          type: boolean
          enum:
            - false
        sku:
          type: string
          minLength: 1
          maxLength: 80
        name:
          type: string
          minLength: 1
          maxLength: 200
        category:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 4000
        status:
          type: string
          enum:
            - active
            - archived
        specs:
          type: array
          maxItems: 100
          items:
            type: object
            required:
              - code
              - name
              - value
            properties:
              code:
                type: string
                minLength: 1
                maxLength: 60
              name:
                type: string
                minLength: 1
                maxLength: 120
              value:
                type: string
                minLength: 1
                maxLength: 500
              unit:
                type: string
                minLength: 1
                maxLength: 40
        moq:
          type: string
          minLength: 1
          maxLength: 120
        leadTime:
          type: string
          minLength: 1
          maxLength: 120
        assets:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/GlobalSiteAsset'
    GlobalSiteTombstone:
      type: object
      required:
        - id
        - revision
        - updatedAt
        - deleted
      properties:
        id:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
        revision:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
        deleted:
          type: boolean
          enum:
            - true
    GlobalSiteMaterial:
      type: object
      required:
        - id
        - revision
        - updatedAt
        - deleted
        - kind
        - title
        - content
        - sourceLabel
        - productIds
        - assets
      properties:
        id:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
        revision:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
        deleted:
          type: boolean
          enum:
            - false
        kind:
          type: string
          enum:
            - company
            - certification
            - factory
            - quality
            - faq
        title:
          type: string
          minLength: 1
          maxLength: 300
        content:
          type: string
          maxLength: 24000
        sourceLabel:
          type: string
          minLength: 1
          maxLength: 500
        productIds:
          type: array
          maxItems: 200
          items:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
        validUntil:
          type: string
          format: date-time
          nullable: true
        assets:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/GlobalSiteAsset'
    GlobalSiteProductResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          oneOf:
            - $ref: '#/components/schemas/GlobalSiteProduct'
            - $ref: '#/components/schemas/GlobalSiteTombstone'
    GlobalSiteProductFeedResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          required:
            - items
            - nextCursor
            - hasMore
          properties:
            items:
              type: array
              maxItems: 200
              items:
                oneOf:
                  - $ref: '#/components/schemas/GlobalSiteProduct'
                  - $ref: '#/components/schemas/GlobalSiteTombstone'
            nextCursor:
              type: string
              minLength: 1
              maxLength: 2048
              description: 最后一页和空页也保留增量水位；原样回传，不可解析。
            hasMore:
              type: boolean
    GlobalSiteMaterialResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          oneOf:
            - $ref: '#/components/schemas/GlobalSiteMaterial'
            - $ref: '#/components/schemas/GlobalSiteTombstone'
    GlobalSiteMaterialFeedResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          required:
            - items
            - nextCursor
            - hasMore
          properties:
            items:
              type: array
              maxItems: 200
              items:
                oneOf:
                  - $ref: '#/components/schemas/GlobalSiteMaterial'
                  - $ref: '#/components/schemas/GlobalSiteTombstone'
            nextCursor:
              type: string
              minLength: 1
              maxLength: 2048
              description: 最后一页和空页也保留增量水位；原样回传，不可解析。
            hasMore:
              type: boolean
    GlobalSiteCapabilitiesResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          required:
            - contractVersion
            - projectId
            - capabilities
            - limits
          properties:
            contractVersion:
              type: string
              enum:
                - '1.0'
            projectId:
              type: string
              pattern: ^[a-fA-F0-9]{24}$
            capabilities:
              type: array
              maxItems: 3
              items:
                type: string
                enum:
                  - globalsite.products.v1
                  - globalsite.materials.v1
                  - globalsite.inquiries.v1
            limits:
              type: object
              required:
                - pageSizeMax
                - inquiryMessageMaxLength
              properties:
                pageSizeMax:
                  type: integer
                  minimum: 1
                  maximum: 200
                inquiryMessageMaxLength:
                  type: integer
                  minimum: 1
                  maximum: 5000
    GlobalSiteInquiryRequest:
      type: object
      required:
        - schemaVersion
        - sourceSystem
        - externalId
        - siteId
        - customerId
        - submittedAt
        - contact
        - message
        - productRefs
        - pageUrl
        - consent
      properties:
        schemaVersion:
          type: string
          enum:
            - '1.0'
        sourceSystem:
          type: string
          enum:
            - globalsite
        externalId:
          type: string
          minLength: 1
          maxLength: 128
        siteId:
          type: string
          minLength: 1
          maxLength: 128
        customerId:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
        submittedAt:
          type: string
          format: date-time
        contact:
          type: object
          required:
            - name
            - email
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
            email:
              type: string
              format: email
              maxLength: 200
            company:
              type: string
              minLength: 1
              maxLength: 200
            phone:
              type: string
              minLength: 1
              maxLength: 60
            country:
              type: string
              minLength: 1
              maxLength: 120
        message:
          type: string
          minLength: 1
          maxLength: 5000
        productRefs:
          type: array
          maxItems: 20
          items:
            type: object
            required:
              - id
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 128
              name:
                type: string
                minLength: 1
                maxLength: 200
        pageUrl:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https?://
          description: 公开页面地址，清理个人信息查询参数；不含用户名密码。
        quantity:
          type: string
          minLength: 1
          maxLength: 120
        utm:
          type: object
          required: []
          properties:
            source:
              type: string
              minLength: 1
              maxLength: 120
            medium:
              type: string
              minLength: 1
              maxLength: 120
            campaign:
              type: string
              minLength: 1
              maxLength: 200
        consent:
          type: object
          required:
            - version
            - accepted
            - at
          properties:
            version:
              type: string
              minLength: 1
              maxLength: 80
            accepted:
              type: boolean
              enum:
                - true
            at:
              type: string
              format: date-time
      additionalProperties: false
    GlobalSiteInquiryResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          required:
            - inquiryId
            - customerId
            - externalId
            - receivedAt
            - deliveryStatus
          properties:
            inquiryId:
              type: string
              pattern: ^[a-fA-F0-9]{24}$
            customerId:
              type: string
              pattern: ^[a-fA-F0-9]{24}$
            externalId:
              type: string
              minLength: 1
              maxLength: 128
            receivedAt:
              type: string
              format: date-time
            deliveryStatus:
              type: string
              enum:
                - stored

  responses:
    Unauthorized:
      description: token 缺失 / 无效 / 已撤销 / 已过期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: { code: "UNAUTHORIZED", message: "服务凭证无效或已失效" }
    ForbiddenScope:
      description: 凭证缺少该端点所需 scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: { code: "FORBIDDEN_SCOPE", message: "凭证缺少所需 scope: customers:upsert" }
    ProjectMismatch:
      description: 项目不存在，或未绑定到该凭证
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: { code: "PROJECT_MISMATCH", message: "项目不存在或凭证未绑定该项目" }
    ValidationError:
      description: 请求字段不合法（消费方不应无限重试）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: "VALIDATION_ERROR"
              message: "数据校验未通过"
              details:
                - field: "body.externalId"
                  message: "Required"
    IdempotencyConflict:
      description: 相同 Idempotency-Key 但载荷不同
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: { code: "CONFLICT", message: "Idempotency-Key 已被不同载荷使用" }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: { code: "NOT_FOUND", message: "客户不存在" }

    GlobalSiteRateLimited:
      description: 草案：429 RATE_LIMITED，按 Retry-After 有界重试。
      headers:
        X-Request-Id:
          schema:
            type: string
        Retry-After:
          schema:
            type: string
          description: 延迟秒数或 HTTP 日期。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GlobalSiteUnavailable:
      description: 草案：503 SERVICE_UNAVAILABLE，临时不可用。
      headers:
        X-Request-Id:
          schema:
            type: string
        Retry-After:
          schema:
            type: string
          description: 延迟秒数或 HTTP 日期。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GlobalSiteInternalError:
      description: 草案：500 INTERNAL_ERROR，保留请求 ID 并原键重试。
      headers:
        X-Request-Id:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

x-globalsite-draft:
  status: draft
  phases: [C1, C2, C3, C4]
  implemented: false
  description: >-
    GlobalSite S1 草案；仅新增定义，不改已有端点。C1–C4 为建议拆分，具体范围以双方批准任务为准。
    冻结快照与原始 SHA 保持不变；CI 校验历史冻结文件与全部旧定义，仅放行明确未实现的约定草案。
    新端点真实权限由 x-required-scope 描述；HTTP bearer security 数组留空。
