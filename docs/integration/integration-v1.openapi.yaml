              type: string
              format: date-time
              description: 本批次服务端上界。完整处理所有页后保存；下一轮 updatedSince 建议回退 1 秒并按 id+updatedAt 去重；不为 null。
    GlobalSiteC1KnowledgeFeed:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
          description: 成功标记；不为 null。
        data:
          type: object
          additionalProperties: false
          required:
            - items
            - nextCursor
            - hasMore
            - syncUntil
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/GlobalSiteC1Knowledge'
              description: 数据项；单例资料最多一条；无值返回 []，不为 null。
            nextCursor:
              type: string
              nullable: true
              description: 不透明签名游标；末页 null。绑定凭证、组织、项目、资源、updatedSince、批次上界；7 天过期。
            hasMore:
              type: boolean
              description: 是否还有下一页；不为 null。
            syncUntil:
              type: string
              format: date-time
              description: 本批次服务端上界。完整处理所有页后保存；下一轮 updatedSince 建议回退 1 秒并按 id+updatedAt 去重；不为 null。
    GlobalSiteC1ProductResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
          description: 不为 null。
        data:
          $ref: '#/components/schemas/GlobalSiteC1Product'

  responses:
    GlobalSiteC2Forbidden:
      description: 用户不是项目管理员/管理员，或CSRF校验失败。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GlobalSiteC2Conflict:
      description: >-
        达到凭证数量上限(details.reason=CREDENTIAL_LIMIT)，或并发轮换/正在宽限期(details.reason=ROTATION_IN_PROGRESS)。不自动重试；用户确认后重操作。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: token 缺失 / 无效 / 已撤销 / 已过期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: { code: "UNAUTHORIZED", message: "服务凭证无效或已失效" }
    ForbiddenScope:
      description: 凭证缺少该端点所需 scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: { code: "FORBIDDEN_SCOPE", message: "凭证缺少所需 scope: customers:upsert" }
    ProjectMismatch:
      description: 项目不存在，或未绑定到该凭证
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: { code: "PROJECT_MISMATCH", message: "项目不存在或凭证未绑定该项目" }
    ValidationError:
      description: 请求字段不合法（消费方不应无限重试）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: "VALIDATION_ERROR"
              message: "数据校验未通过"
              details:
                - field: "body.externalId"
                  message: "Required"
    IdempotencyConflict:
      description: 相同 Idempotency-Key 但载荷不同
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: { code: "CONFLICT", message: "Idempotency-Key 已被不同载荷使用" }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: { code: "NOT_FOUND", message: "客户不存在" }

    GlobalSiteRateLimited:
      description: 草案：429 RATE_LIMITED，按 Retry-After 有界重试。
      headers:
        X-Request-Id:
          schema:
            type: string
        Retry-After:
          schema:
            type: string
          description: 延迟秒数或 HTTP 日期。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GlobalSiteUnavailable:
      description: 草案：503 SERVICE_UNAVAILABLE，临时不可用。
      headers:
        X-Request-Id:
          schema:
            type: string
        Retry-After:
          schema:
            type: string
          description: 延迟秒数或 HTTP 日期。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GlobalSiteInternalError:
      description: 草案：500 INTERNAL_ERROR，保留请求 ID 并原键重试。
      headers:
        X-Request-Id:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    GlobalSiteC1RateLimited:
      description: 每凭证所有绑定项目合计每 UTC 固定分钟最多 120 次请求（包括图片）；所有 API 实例共享 Mongo 原子计数。无权限请求先返回 403。旧端点业务结构不变，新增此防护。
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: 距窗口结束的秒数。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

